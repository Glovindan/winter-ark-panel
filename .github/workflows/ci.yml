name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @ark/web

      - name: Logic test of the server update script
        run: bash deploy/test/update.test.sh

      - name: Package release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tar -czf ark-deploy.tgz \
            package.json package-lock.json tsconfig.base.json \
            packages/shared/package.json packages/shared/tsconfig.json packages/shared/src \
            apps/server/package.json apps/server/tsconfig.json apps/server/src \
            apps/web/package.json apps/web/dist

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release
          path: ark-deploy.tgz
          retention-days: 7

  deploy:
    needs: test
    # Деплой включается переменной репозитория DEPLOY_ENABLED=true (Settings → Secrets and variables → Variables)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Deploy over SSH (forced command ark-deploy)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" < ark-deploy.tgz
